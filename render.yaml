services:
  - type: web
    name: gtt-foundation-platform
    env: node
    plan: free
    buildCommand: npm install && npm run build --prefix frontend && npm install --prefix backend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        value: https://glejeuvbpbetduhazwfn.supabase.co
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
